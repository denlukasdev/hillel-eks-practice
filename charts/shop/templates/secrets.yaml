{{- if .Values.secrets.enabled }}
{{/*
SecretStore і ExternalSecret — ті самі, що в apps/shop, але з іменами
від імені релізу. Так чарт можна поставити кілька разів у різні namespace.
*/}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-parameter-store
  labels:
    {{- include "shop.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.secrets.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "shop.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}-parameter-store
  target:
    name: {{ .Release.Name }}-config
    creationPolicy: Owner
  data:
    - secretKey: BANNER
      remoteRef:
        key: {{ .Values.secrets.bannerParameter }}
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.dbPasswordParameter }}
{{- end }}
