# ---------------------------------------------------------------------------
# External Secrets Operator (ESO).
#
# Що робить: за описом ExternalSecret іде в зовнішнє сховище (у нас —
# SSM Parameter Store), бере значення і створює з нього звичайний
# Kubernetes Secret. Далі періодично звіряє: змінилось значення в AWS —
# оновлює Secret.
#
# Доступ до AWS — через Pod Identity (роль і асоціація: cluster/platform-iam.tf).
# ---------------------------------------------------------------------------
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "2.11.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets

  targetNamespace: external-secrets
  releaseName: external-secrets      # див. пояснення в aws-load-balancer-controller.yaml

  install:
    createNamespace: true            # namespace external-secrets створить сам Flux
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    # Типи SecretStore, ExternalSecret та інші ставить сам чарт.
    installCRDs: true

    serviceAccount:
      create: true
      name: external-secrets         # = service_account у Pod Identity

    # Чарт ставить ТРИ поди: сам оператор, вебхук (перевіряє ваші
    # ExternalSecret на коректність) і контролер сертифікатів для вебхука.
    # Доступ до AWS потрібен лише першому.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
