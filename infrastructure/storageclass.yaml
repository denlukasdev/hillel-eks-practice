# ---------------------------------------------------------------------------
# Заняття 11. Клас сховища gp3 — диски EBS для PersistentVolumeClaim.
#
# ЧОМУ ВЗАГАЛІ ПОТРІБЕН: у кластерах EKS від версії 1.30 клас gp2 існує,
# але вже НЕ позначений як клас за замовчуванням. PVC без storageClassName
# у такому кластері вічно висить у Pending — жоден provisioner його не бере.
#
# Клас сховища — рішення платформи, а не застосунку, тому він лежить тут,
# в infrastructure/, і приходить у кластер через infra-sync.
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    # Цей клас отримає будь-який PVC, де storageClassName не вказано.
    storageclass.kubernetes.io/is-default-class: "true"

# Драйвер EBS CSI — доповнення EKS, яке ми поставили ще на занятті 8
# (cluster/eks.tf, aws-ebs-csi-driver з роллю через Pod Identity).
provisioner: ebs.csi.aws.com

parameters:
  type: gp3            # дешевший і швидший за gp2 при тому самому розмірі
  encrypted: "true"    # шифрування ключем aws/ebs, яким керує AWS

# НАЙВАЖЛИВІШЕ ПОЛЕ.
# EBS — диск ОДНІЄЇ зони доступності. Immediate створив би диск одразу,
# у випадковій зоні, і под міг би опинитися на вузлі в іншій — тоді він
# ніколи не запуститься. WaitForFirstConsumer чекає, доки планувальник
# вибере вузол для пода, і створює диск у зоні цього вузла.
volumeBindingMode: WaitForFirstConsumer

# Видалили PVC — видалився й диск в AWS. Для навчального кластера саме те.
# У продакшні для баз часто ставлять Retain, щоб випадкове видалення PVC
# не знищило дані.
reclaimPolicy: Delete

# Дозволяє збільшити розмір PVC без перестворення (зменшити — ні).
allowVolumeExpansion: true
