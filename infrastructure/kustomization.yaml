# Інфраструктура кластера: компоненти, які потрібні застосункам.
# Flux застосовує цю теку через Kustomization infra-sync (cluster/flux-infrastructure.tf).
#
# Порядок у списку не важливий: Flux сам спочатку створює джерела,
# а HelmRelease чекає, доки його HelmRepository стане Ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sources.yaml
  - aws-load-balancer-controller.yaml
  - external-secrets.yaml
  - storageclass.yaml          # заняття 11: клас сховища gp3 за замовчуванням
