# ---------------------------------------------------------------------------
# Заняття 13. nginx зі СТРУКТУРОВАНИМ журналом доступу.
#
# Звичайний рядок nginx — це текст, у якому поля треба вирізати регулярним
# виразом. Тут кожен запит — один рядок JSON: поля мають імена, і сховище
# логів може фільтрувати й рахувати за ними без жодного розбору.
#
# escape=json  екранує лапки й спецсимволи у значеннях, щоб JSON не ламався.
# $request_id  унікальний ідентифікатор запиту: за ним один запит знаходять
#              у логах усіх сервісів, через які він пройшов.
# ---------------------------------------------------------------------------
log_format json escape=json
  '{"time":"$time_iso8601",'
  '"message":"$request",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"client":"$remote_addr",'
  '"user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';

server {
  listen 80;

  # Як у Kubernetes: застосунок пише в stdout, його видно в `docker compose logs`.
  access_log /dev/stdout json;

  # Копія у спільний том. У кластері цю роль грає тека /var/log/pods на вузлі,
  # куди середовище виконання складає stdout кожного контейнера.
  # Звідси рядки забирає Fluent Bit.
  access_log /var/log/shop/access.log json;

  location = /healthz {
    default_type text/plain;
    return 200 'ok\n';
  }

  location = / {
    default_type text/plain;
    return 200 'shop web: logging stand. try /api/items, /admin, /api/pay\n';
  }

  location = /api/items {
    default_type application/json;
    return 200 '[{"id":1,"name":"coffee"},{"id":2,"name":"tea"}]\n';
  }

  # «Зламаний» платіжний сервіс: щоб у логах були помилки сервера.
  location = /api/pay {
    default_type application/json;
    return 503 '{"error":"payment backend unavailable"}\n';
  }

  # Закрита сторінка: щоб у логах були відмови в доступі.
  location /admin {
    return 403;
  }

  # Усе інше — 404.
  location / {
    return 404;
  }
}
