# ---------------------------------------------------------------------------
# SecretStore — ЗВІДКИ брати секрети.
#
# Описує сховище один раз: провайдер, сервіс, регіон. Усі ExternalSecret
# у цьому namespace посилаються на нього за іменем.
#
# Блоку auth немає свідомо: оператор бере облікові дані зі свого оточення,
# а їх йому видає Pod Identity (cluster/platform-iam.tf). Жодного ключа тут.
#
# Є ще ClusterSecretStore — те саме, але для всіх namespace одразу.
# Нам вистачає звичайного: сховище потрібне лише застосунку shop.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
