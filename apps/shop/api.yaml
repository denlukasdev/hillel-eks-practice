# ---------------------------------------------------------------------------
# api — віддає JSON. Той самий сервіс, що в блоці про Kubernetes.
#
# requests — ГАРАНТОВАНИЙ мінімум. За ними планувальник вирішує, на який
# вузол поставити под. Сума requests усіх подів не може перевищити
# allocatable вузла — інакше под лишиться Pending.
#
# limits — СТЕЛЯ. Перевищив пам'ять — под убивають (OOMKilled).
# Перевищив процесор — под пригальмовують, але не вбивають.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx
data:
  default.conf: |
    server {
      listen 80;
      location /healthz { return 200 'ok'; }
      location / {
        default_type application/json;
        return 200 '{"service":"api","version":"1"}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          # -----------------------------------------------------------------
          # Заняття 10: пароль бази як ЗМІННА СЕРЕДОВИЩА.
          # Самому nginx він не потрібен — база з'явиться на занятті 11.
          # Зараз на ньому видно важливу річ: змінна читається ОДИН РАЗ,
          # коли стартує контейнер. Оновився Secret — у живому поді
          # лишається старе значення, доки под не перезапустять.
          #
          # optional: true — под стартує й тоді, коли Secret ще немає.
          # Без цього, поки ви не ввімкнули ExternalSecret, под висів би
          # у CreateContainerConfigError.
          # -----------------------------------------------------------------
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-config
                  key: DB_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: api-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
