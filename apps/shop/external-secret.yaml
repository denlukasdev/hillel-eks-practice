# ---------------------------------------------------------------------------
# ExternalSecret — ЩО взяти і ЯКИЙ Secret із цього зробити.
#
# Параметри створюєте ви самі в CloudShell (docs/lesson-10.md, крок 2):
#   /shop/banner       тип String       — текст, який показує web
#   /shop/db-password  тип SecureString — пароль бази для заняття 11
#
# У git — лише ІМЕНА параметрів. Значень тут немає й бути не повинно.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-config
spec:
  # Як часто оператор звіряє значення з AWS. На занятті — хвилина,
  # щоб побачити оновлення наживо. У продакшні зазвичай 1h:
  # кожна звірка — це запит до AWS API.
  refreshInterval: 1m

  secretStoreRef:
    kind: SecretStore
    name: aws-parameter-store

  target:
    name: shop-config          # ім'я Secret, який створить оператор
    creationPolicy: Owner      # Secret належить цьому ExternalSecret:
                               # видалите ExternalSecret — зникне й Secret

  data:
    - secretKey: BANNER        # ключ у Secret
      remoteRef:
        key: /shop/banner      # параметр у Parameter Store
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /shop/db-password # SecureString оператор розшифровує сам
