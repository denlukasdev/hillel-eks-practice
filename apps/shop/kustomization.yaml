# Kustomize збирає ці файли докупи. Flux застосовує саме цю теку.
# Щоб додати новий об'єкт — покладіть файл сюди й допишіть його в перелік.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml

  # --- Заняття 10, практика 1: вхід з інтернету ---------------------------
  # Розкоментуйте рядок нижче, закомітьте — і за кілька хвилин у вас буде NLB.
  # НАПРИКІНЦІ ЗАНЯТТЯ закоментуйте його знову: NLB тарифікується погодинно
  # незалежно від того, чи є вузли.
  # - web-public.yaml

  # --- Заняття 10, практика 2: секрети з AWS ------------------------------
  # Розкоментуйте обидва рядки разом: ExternalSecret без SecretStore не працює.
  # - secret-store.yaml
  # - external-secret.yaml
